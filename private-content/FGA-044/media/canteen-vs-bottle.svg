<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Four-part evidence checklist for choosing a drinking-water canteen or bottle: potable materials, cleaning, carry fit, refill plan"><title>Canteen vs Water Bottle: Carry, Clean &amp; Refill</title>
<desc>Original FieldGearAtlas conceptual infographic related to Canteen vs Water Bottle: Carry, Clean &amp; Refill. No product model is represented or independently tested.</desc>

<rect width="1600" height="900" fill="#FFF8F0"/><rect width="1600" height="19" fill="#354A35"/>
<text x="78" y="115" font-family="Arial,sans-serif" font-size="59" font-weight="800" fill="#354A35">CANTEEN OR WATER BOTTLE?</text>
<text x="80" y="163" font-family="Arial,sans-serif" font-size="29" fill="#875B3C">Choose by evidence: water safety, cleaning, carry fit and refill plan</text>
<g font-family="Arial,sans-serif">
<rect x="78" y="220" width="693" height="235" rx="25" fill="#E5EADB" stroke="#A6B89E" stroke-width="3"/><rect x="831" y="220" width="693" height="235" rx="25" fill="#EFE7DE" stroke="#CBB6A4" stroke-width="3"/>
<rect x="78" y="491" width="693" height="235" rx="25" fill="#EFE7DE" stroke="#CBB6A4" stroke-width="3"/><rect x="831" y="491" width="693" height="235" rx="25" fill="#E5EADB" stroke="#A6B89E" stroke-width="3"/>
<text x="125" y="295" font-size="37" font-weight="bold" fill="#354A35">01 · Potable water use</text><text x="125" y="352" font-size="27" fill="#354A35">Maker confirms food-contact purpose?</text><text x="125" y="395" font-size="23" fill="#354A35">Military styling alone is not proof.</text>
<text x="880" y="295" font-size="37" font-weight="bold" fill="#875B3C">02 · Cleaning access</text><text x="880" y="352" font-size="27" fill="#354A35">Can you wash the lid and gasket?</text><text x="880" y="395" font-size="23" fill="#354A35">Inspect corners, wear and residue.</text>
<text x="125" y="562" font-size="37" font-weight="bold" fill="#875B3C">03 · Carry compatibility</text><text x="125" y="620" font-size="27" fill="#354A35">Does the exact carrier secure it?</text><text x="125" y="663" font-size="23" fill="#354A35">Check dimensions, cap and retention.</text>
<text x="880" y="562" font-size="37" font-weight="bold" fill="#354A35">04 · Refill and treatment</text><text x="880" y="620" font-size="27" fill="#354A35">Where will safe water come from?</text><text x="880" y="663" font-size="23" fill="#354A35">Storage cannot make unsafe water safe.</text>
</g>
<rect x="80" y="756" width="1440" height="84" rx="17" fill="#354A35"/><text x="110" y="793" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">UNKNOWN MATERIAL OR DAMAGED SEAL?</text><text x="110" y="823" font-family="Arial,sans-serif" font-size="21" fill="#EAF2E6">Choose a container explicitly intended for drinking water; follow exact maker instructions.</text>
<text x="1480" y="876" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#875B3C">FieldGearAtlas · Conceptual illustration; no product test</text>
</svg>