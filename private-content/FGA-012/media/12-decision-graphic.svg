<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Backpack sizing sequence</title><desc id="desc">Measure torso at C7 to top-of-hips line; check hip circumference; compare to maker pack range.</desc><rect width="1600" height="900" fill="#FFF9F0"/><text x="64" y="85" font-family="Arial, sans-serif" font-size="54" fill="#354A35" font-weight="700" >BACKPACK FIT: MEASURE THE RIGHT THINGS</text><text x="64" y="133" font-family="Arial, sans-serif" font-size="26" fill="#875B3C"  >A three-measurement check before adjusting straps</text><rect x="54" y="214" width="493" height="457" rx="20" fill="#F1EDE2" stroke="#B5BBAA" stroke-width="3"/><text x="84" y="279" font-family="Arial, sans-serif" font-size="32" fill="#354A35" font-weight="700" >1. TORSO LENGTH</text><text x="84" y="392" font-family="Arial, sans-serif" font-size="26" fill="#222B25"  >C7 at base of neck</text><text x="84" y="432" font-family="Arial, sans-serif" font-size="26" fill="#222B25"  >to iliac-crest reference line</text><text x="514" y="720" font-family="Arial, sans-serif" font-size="55" fill="#875B3C" font-weight="700" >→</text><rect x="579" y="214" width="493" height="457" rx="20" fill="#F1EDE2" stroke="#354A35" stroke-width="3"/><text x="609" y="279" font-family="Arial, sans-serif" font-size="32" fill="#354A35" font-weight="700" >2. HIP CIRCUMFERENCE</text><text x="609" y="392" font-family="Arial, sans-serif" font-size="26" fill="#222B25"  >Measure around top of hips</text><text x="609" y="432" font-family="Arial, sans-serif" font-size="26" fill="#222B25"  >not the pant-waist line</text><text x="1039" y="720" font-family="Arial, sans-serif" font-size="55" fill="#875B3C" font-weight="700" >→</text><rect x="1104" y="214" width="493" height="457" rx="20" fill="#F1EDE2" stroke="#B5BBAA" stroke-width="3"/><text x="1134" y="279" font-family="Arial, sans-serif" font-size="32" fill="#354A35" font-weight="700" >3. PACK MODEL RANGE</text><text x="1134" y="392" font-family="Arial, sans-serif" font-size="26" fill="#222B25"  >Compare both measurements</text><text x="1134" y="432" font-family="Arial, sans-serif" font-size="26" fill="#222B25"  >to manufacturer specifications</text><rect x="68" y="728" width="1460" height="70" rx="20" fill="#354A35" stroke="none" stroke-width="3"/><text x="100" y="772" font-family="Arial, sans-serif" font-size="26" fill="#FFF"  >Loaded try-on still matters: hipbelt position, shoulder fit and movement.</text><rect x="0" y="830" width="1600" height="70" fill="#354A35"/><text x="64" y="873" font-size="25" fill="#FFF" font-family="Arial" font-weight="700">FieldGearAtlas</text><text x="1532" y="872" text-anchor="end" font-size="19" fill="#F3EAE1" font-family="Arial">Illustrative guide • Not a product test</text></svg>