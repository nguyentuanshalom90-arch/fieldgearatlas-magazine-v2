<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Safety toe selection framework</title><desc id="desc">Workplace risk and applicable protective marking matter more than a generic steel/composite label.</desc><rect width="1600" height="900" fill="#FFF9F0"/><text x="64" y="85" font-family="Arial, sans-serif" font-size="54" fill="#354A35" font-weight="700" >SAFETY TOE: MATERIAL IS NOT A RATING</text><text x="64" y="133" font-family="Arial, sans-serif" font-size="26" fill="#875B3C"  >A decision process for workplace protective footwear</text><rect x="68" y="184" width="1464" height="115" rx="20" fill="#354A35" stroke="none" stroke-width="3"/><text x="105" y="231" font-family="Arial, sans-serif" font-size="34" fill="#FFF" font-weight="700" >01  IDENTIFY THE HAZARD</text><text x="105" y="271" font-family="Arial, sans-serif" font-size="28" fill="#FFF"  >Impact • Compression • Puncture • Electrical exposure (if applicable)</text><rect x="80" y="340" width="695" height="260" rx="20" fill="#ECE7DA" stroke="#354A35" stroke-width="3"/><text x="110" y="402" font-family="Arial, sans-serif" font-size="38" fill="#354A35" font-weight="700" >STEEL CAP</text><text x="110" y="456" font-family="Arial, sans-serif" font-size="29" fill="#222B25"  >Inspect protective marking</text><text x="110" y="520" font-family="Arial, sans-serif" font-size="23" fill="#222B25"  >Material alone does not prove a rating</text><rect x="835" y="340" width="695" height="260" rx="20" fill="#ECE7DA" stroke="#875B3C" stroke-width="3"/><text x="865" y="402" font-family="Arial, sans-serif" font-size="38" fill="#875B3C" font-weight="700" >COMPOSITE CAP</text><text x="865" y="456" font-family="Arial, sans-serif" font-size="29" fill="#222B25"  >Inspect protective marking</text><text x="865" y="520" font-family="Arial, sans-serif" font-size="23" fill="#222B25"  >Material alone does not prove a rating</text><path d="M800,299 L800,340" stroke="#354A35" stroke-width="5"  fill="none"/><rect x="245" y="657" width="1110" height="116" rx="20" fill="#DCE4D5" stroke="none" stroke-width="3"/><text x="280" y="708" font-family="Arial, sans-serif" font-size="33" fill="#354A35" font-weight="700" >02  MATCH THE MARKING TO THE JOB</text><text x="280" y="747" font-family="Arial, sans-serif" font-size="25" fill="#222B25"  >Verify model, employer requirements and the applicable OSHA route.</text><rect x="0" y="830" width="1600" height="70" fill="#354A35"/><text x="64" y="873" font-size="25" fill="#FFF" font-family="Arial" font-weight="700">FieldGearAtlas</text><text x="1532" y="872" text-anchor="end" font-size="19" fill="#F3EAE1" font-family="Arial">Illustrative guide • Not a product test</text></svg>