<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sleeping bag temperature rating comparison boundaries</title><desc id="desc">ISO-tested recreational comfort and lower-limit values have a different basis than military ratings or unspecified seller numbers.</desc><rect width="1600" height="900" fill="#FFF9F0"/><text x="64" y="85" font-family="Arial, sans-serif" font-size="54" fill="#354A35" font-weight="700" >SLEEPING BAG RATINGS: COMPARE LIKE WITH LIKE</text><text x="64" y="133" font-family="Arial, sans-serif" font-size="26" fill="#875B3C"  >A named temperature is not automatically an ISO comfort value</text><rect x="69" y="196" width="1460" height="109" rx="20" fill="#354A35" stroke="none" stroke-width="3"/><text x="100" y="259" font-family="Arial, sans-serif" font-size="34" fill="#FFF" font-weight="700" >READ THE LABEL: Which test method and rating type?</text><path d="M798,304 L798,340" stroke="#354A35" stroke-width="5"  fill="none"/><rect x="69" y="355" width="706" height="334" rx="20" fill="#E8EDDF" stroke="#354A35" stroke-width="3"/><text x="96" y="424" font-family="Arial, sans-serif" font-size="31" fill="#354A35" font-weight="700" >ISO-TESTED RECREATIONAL</text><text x="96" y="513" font-family="Arial, sans-serif" font-size="25" fill="#222B25"  >Comfort vs limit: distinct metrics</text><text x="96" y="571" font-family="Arial, sans-serif" font-size="23" fill="#222B25"  >Match standards, pad and test basis</text><rect x="821" y="355" width="706" height="334" rx="20" fill="#EEE3D8" stroke="#875B3C" stroke-width="3"/><text x="848" y="424" font-family="Arial, sans-serif" font-size="31" fill="#875B3C" font-weight="700" >MILITARY / UNKNOWN PROTOCOL</text><text x="848" y="513" font-family="Arial, sans-serif" font-size="25" fill="#222B25"  >ISO 23537-1 excludes specific military use</text><text x="848" y="571" font-family="Arial, sans-serif" font-size="23" fill="#222B25"  >Attribute seller claims; request test evidence</text><rect x="100" y="720" width="1400" height="76" rx="20" fill="#E7EAD9" stroke="none" stroke-width="3"/><text x="137" y="769" font-family="Arial, sans-serif" font-size="25" fill="#354A35"  >Neither branch guarantees a person will sleep warm: the full sleep system matters.</text><rect x="0" y="830" width="1600" height="70" fill="#354A35"/><text x="64" y="873" font-size="25" fill="#FFF" font-family="Arial" font-weight="700">FieldGearAtlas</text><text x="1532" y="872" text-anchor="end" font-size="19" fill="#F3EAE1" font-family="Arial">Illustrative guide • Not a product test</text></svg>