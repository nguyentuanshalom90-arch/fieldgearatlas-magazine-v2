<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="NSN vs Manufacturer Part Number"><title>NSN vs Part Number: Military Gear IDs Explained</title>
<desc>Original FieldGearAtlas conceptual infographic related to NSN vs Part Number: Military Gear IDs Explained. No product model is represented or independently tested.</desc>
<rect width="1600" height="900" fill="#FBF8F2"/><rect width="1600" height="14" fill="#354A35"/><text x="65" y="74" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#875B3C" text-anchor="start">FIELDGEARATLAS  /  ORIGINAL FIELD GUIDE</text><text x="65" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#354A35" text-anchor="start">NSN vs Manufacturer Part Number</text><text x="66" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#233528" text-anchor="start">Do not conflate logistics identity, source identity and physical-item provenance</text><rect x="55" y="246" width="705" height="500" rx="20" fill="#FFFFFF" stroke="#E5DCCB" stroke-width="2"/><rect x="840" y="246" width="705" height="500" rx="20" fill="#FFFFFF" stroke="#E5DCCB" stroke-width="2"/><text x="96" y="319" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#354A35" text-anchor="start">NATIONAL STOCK NUMBER (NSN)</text><rect x="96" y="355" width="255" height="110" rx="8" fill="#354A35" stroke="none" stroke-width="0"/><rect x="359" y="355" width="357" height="110" rx="8" fill="#875B3C" stroke="none" stroke-width="0"/><text x="223" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle">4 DIGITS</text><text x="537" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle">9 DIGITS</text><text x="222" y="504" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#233528" text-anchor="middle">Supply class</text><text x="535" y="504" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#233528" text-anchor="middle">NIIN identity</text><text x="97" y="614" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#875B3C" text-anchor="start">Catalog identity for an item of supply</text><text x="882" y="319" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#354A35" text-anchor="start">MANUFACTURER PART NUMBER</text><rect x="885" y="354" width="615" height="111" rx="12" fill="#ECF0E7" stroke="none" stroke-width="0"/><text x="1190" y="417" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#354A35" text-anchor="middle">FORMAT VARIES BY MAKER</text><text x="886" y="526" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#233528" text-anchor="start">Pair with an exact CAGE/reference match.</text><text x="886" y="566" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#233528" text-anchor="start">Do not mistake an identifier for proof of issue.</text><text x="800" y="784" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#875B3C" text-anchor="middle">Catalog identity ≠ condition, origin, authenticity or the history of an individual item.</text><rect x="52" y="812" width="1496" height="62" rx="12" fill="#354A35" stroke="none" stroke-width="0"/><text x="78" y="852" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="start">Conceptual diagram • Not a test result • Check exact model/source documentation</text>
</svg>