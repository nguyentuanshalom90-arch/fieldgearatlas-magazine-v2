<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Rucking Foot Care: Find Hot Spots Before They Become Blisters</title>
<desc>Original FieldGearAtlas conceptual infographic related to Rucking Foot Care: Find Hot Spots Before They Become Blisters. No product model is represented or independently tested.</desc>

<rect x="0" y="0" width="1600" height="900" rx="0" fill="#F8F5EC" stroke="none" stroke-width="0"/>
<rect x="0" y="0" width="1600" height="22" rx="0" fill="#354A35" stroke="none" stroke-width="0"/>
<text x="72" y="96" fill="#354A35" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start">FIELDGEARATLAS  /  INDEPENDENT GEAR RESEARCH</text>
<text x="72" y="163" fill="#354A35" font-family="DejaVu Sans,Arial,sans-serif" font-size="53" font-weight="800" text-anchor="start">FOOT HOT-SPOT RESPONSE</text>
<text x="72" y="214" fill="#875B3C" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="500" text-anchor="start">Act before repeated rubbing becomes a blister</text>
<rect x="70" y="274" width="480" height="390" rx="18" fill="#FFFFFF" stroke="#DBE1D7" stroke-width="2"/>
<rect x="70" y="274" width="480" height="78" rx="18" fill="#354A35" stroke="none" stroke-width="0"/>
<text x="94" y="326" fill="#FFFFFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">01    FEEL</text>
<text x="94" y="411" fill="#354A35" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Notice a persistent warm spot</text>
<text x="94" y="474" fill="#263A2C" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Stop and inspect the skin</text>
<circle cx="302" cy="556" r="69" fill="#E8EEE5" />
<circle cx="302" cy="556" r="29" fill="#C88A5E" />
<circle cx="302" cy="556" r="10" fill="#354A35" />
<rect x="578" y="274" width="480" height="390" rx="18" fill="#FFFFFF" stroke="#DBE1D7" stroke-width="2"/>
<rect x="578" y="274" width="480" height="78" rx="18" fill="#875B3C" stroke="none" stroke-width="0"/>
<text x="602" y="326" fill="#FFFFFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">02    FIND</text>
<text x="602" y="411" fill="#354A35" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Check fit, sock, debris</text>
<text x="602" y="474" fill="#263A2C" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">Locate pressure or movement</text>
<circle cx="810" cy="556" r="69" fill="#E8EEE5" />
<circle cx="810" cy="556" r="29" fill="#C88A5E" />
<circle cx="810" cy="556" r="10" fill="#354A35" />
<rect x="1086" y="274" width="480" height="390" rx="18" fill="#FFFFFF" stroke="#DBE1D7" stroke-width="2"/>
<rect x="1086" y="274" width="480" height="78" rx="18" fill="#354A35" stroke="none" stroke-width="0"/>
<text x="1110" y="326" fill="#FFFFFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start">03    ADJUST</text>
<text x="1110" y="411" fill="#354A35" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">Dry, protect and reassess</text>
<text x="1110" y="474" fill="#263A2C" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start">End the walk if discomfort persists</text>
<circle cx="1318" cy="556" r="69" fill="#E8EEE5" />
<circle cx="1318" cy="556" r="29" fill="#C88A5E" />
<circle cx="1318" cy="556" r="10" fill="#354A35" />
<rect x="70" y="710" width="1460" height="112" rx="16" fill="#354A35" stroke="none" stroke-width="0"/>
<text x="100" y="757" fill="#EAD5B5" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start">CHECK THE LIMIT</text>
<text x="100" y="799" fill="#FFFFFF" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start">Pain and numbness are not training targets; this is equipment guidance, not medical treatment.</text>
<text x="1506" y="863" fill="#875B3C" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="end">Conceptual diagram · Not a photographed or tested product</text>
