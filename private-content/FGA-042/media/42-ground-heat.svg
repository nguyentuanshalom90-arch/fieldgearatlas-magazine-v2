<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Camping mattress thermal resistance schematic</title><desc id="desc">A camping mattress is compressed between controlled plates for comparative ASTM thermal resistance measurement; it is not a field-temperature guarantee.</desc><rect width="1600" height="900" fill="#FFF9F0"/><text x="64" y="85" font-family="Arial, sans-serif" font-size="54" fill="#354A35" font-weight="700" >SLEEPING PAD R-VALUE: WHAT IS MEASURED?</text><text x="64" y="133" font-family="Arial, sans-serif" font-size="26" fill="#875B3C"  >ASTM F3340-22 provides a controlled comparison method</text><rect x="76" y="228" width="1448" height="101" rx="20" fill="#C9D4C1" stroke="none" stroke-width="3"/><text x="105" y="292" font-family="Arial, sans-serif" font-size="39" fill="#354A35" font-weight="700" >WARM PLATE</text><rect x="240" y="350" width="1120" height="122" rx="20" fill="#D9C7B2" stroke="#875B3C" stroke-width="3"/><text x="273" y="428" font-family="Arial, sans-serif" font-size="30" fill="#354A35" font-weight="700" >CAMPING MAT / PAD UNDER CONTROLLED COMPRESSION</text><rect x="76" y="494" width="1448" height="101" rx="20" fill="#D7E2E7" stroke="none" stroke-width="3"/><text x="105" y="557" font-family="Arial, sans-serif" font-size="39" fill="#354A35" font-weight="700" >COLD PLATE</text><path d="M520,331 L520,348" stroke="#875B3C" stroke-width="5"  fill="none"/><path d="M520,474 L520,491" stroke="#875B3C" stroke-width="5"  fill="none"/><path d="M800,331 L800,348" stroke="#875B3C" stroke-width="5"  fill="none"/><path d="M800,474 L800,491" stroke="#875B3C" stroke-width="5"  fill="none"/><path d="M1080,331 L1080,348" stroke="#875B3C" stroke-width="5"  fill="none"/><path d="M1080,474 L1080,491" stroke="#875B3C" stroke-width="5"  fill="none"/><rect x="80" y="649" width="1440" height="153" rx="20" fill="#EBE9E0" stroke="none" stroke-width="3"/><text x="115" y="707" font-family="Arial, sans-serif" font-size="31" fill="#354A35" font-weight="700" >HIGHER TESTED R → MORE RESISTANCE TO HEAT FLOW</text><text x="115" y="763" font-family="Arial, sans-serif" font-size="28" fill="#875B3C"  >It does NOT directly state the sleeper’s minimum safe temperature.</text><rect x="0" y="830" width="1600" height="70" fill="#354A35"/><text x="64" y="873" font-size="25" fill="#FFF" font-family="Arial" font-weight="700">FieldGearAtlas</text><text x="1532" y="872" text-anchor="end" font-size="19" fill="#F3EAE1" font-family="Arial">Illustrative guide • Not a product test</text></svg>