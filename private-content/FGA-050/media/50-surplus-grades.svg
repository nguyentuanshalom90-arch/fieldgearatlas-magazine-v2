<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Surplus Grades: Inspect the Item, Not the Adjective">
<title>Surplus Grades: Inspect the Item, Not the Adjective</title><desc>Original FieldGearAtlas explanatory visual for general equipment selection. No commercial product or first-hand test shown.</desc>
<rect width="1600" height="900" fill="#FFF8F0"/>
<text x="62" y="66" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="23" font-weight="700">FIELDGEARATLAS  /  ORIGINAL RESEARCH VISUAL</text>
<line x1="62" y1="86" x2="1538" y2="86" stroke="#875B3C" stroke-width="4" />
<text x="62" y="148" fill="#273429" text-anchor="start" font-family="Arial, sans-serif" font-size="54" font-weight="700">Surplus Grades: Inspect the Item, Not the Adjective</text><text x="1536" y="149" fill="#875B3C" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700">LISTING EVIDENCE</text>
<rect x="62" y="188" width="680" height="525" rx="14" fill="white" stroke="#e5e6d9" stroke-width="3"/>
<text x="97" y="238" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="32" font-weight="700">Listing A: “Excellent”</text>
<text x="97" y="277" fill="#875B3C" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="400">Grade word but no condition photographs</text>
<rect x="182" y="355" width="435" height="190" rx="18" fill="#eae6dc" stroke="#875B3C" stroke-width="3"/>
<text x="397" y="438" fill="#875B3C" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700">EXCELLENT</text>
<text x="397" y="490" fill="#273429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400">No defects itemized</text><rect x="858" y="188" width="680" height="525" rx="14" fill="white" stroke="#e5e6d9" stroke-width="3"/>
<text x="893" y="238" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="32" font-weight="700">Listing B: documented</text>
<text x="893" y="277" fill="#875B3C" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="400">Photos, defects, function check and returns</text>
<rect x="978" y="355" width="435" height="245" rx="18" fill="#e1eadc" stroke="#354A35" stroke-width="3"/>
<text x="1005" y="403" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700">✓  Interior + wear-area photos</text>
<text x="1005" y="452" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700">✓  Zippers and seams checked</text>
<text x="1005" y="501" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700">✓  Missing parts identified</text>
<text x="1005" y="550" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700">✓  Return terms documented</text>
<rect x="62" y="765" width="1476" height="87" rx="16" fill="#354A35" stroke="#354A35" stroke-width="3"/><text x="92" y="817" fill="#ffffff" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="700">SELLER GRADES ARE NOT A UNIVERSAL GOVERNMENT SCALE.</text>
