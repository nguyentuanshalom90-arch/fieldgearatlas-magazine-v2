<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="MA-1 Jacket: What to Inspect">
<title>MA-1 Jacket: What to Inspect</title><desc>Original FieldGearAtlas explanatory visual for general equipment selection. No commercial product or first-hand test shown.</desc>
<rect width="1600" height="900" fill="#FFF8F0"/>
<text x="62" y="66" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="23" font-weight="700">FIELDGEARATLAS  /  ORIGINAL RESEARCH VISUAL</text>
<line x1="62" y1="86" x2="1538" y2="86" stroke="#875B3C" stroke-width="4" />
<text x="62" y="148" fill="#273429" text-anchor="start" font-family="Arial, sans-serif" font-size="54" font-weight="700">MA-1 Jacket: What to Inspect</text><text x="1536" y="149" fill="#875B3C" text-anchor="end" font-family="Arial, sans-serif" font-size="22" font-weight="700">HERITAGE CHECK</text>
<rect x="62" y="188" width="680" height="525" rx="14" fill="white" stroke="#e5e6d9" stroke-width="3"/>
<text x="97" y="238" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="32" font-weight="700">Recognizable silhouette</text>
<text x="97" y="277" fill="#875B3C" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="400">Collar, cuffs, closure and pockets</text>
<path d="M660 325 L760 325 L814 378 L887 457 L848 513 L822 482 L812 663 L607 663 L597 482 L571 513 L532 457 L607 378 Z" fill="#6c7959" stroke="#354A35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M660 325 L710 385 L760 325" fill="none" stroke="#875B3C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="710" y1="386" x2="710" y2="663" stroke="#FFF8F0" stroke-width="4" />
<rect x="610" y="513" width="100" height="80" rx="14" fill="#7c8a67" stroke="#875B3C" stroke-width="3"/>
<rect x="715" y="513" width="96" height="80" rx="14" fill="#7c8a67" stroke="#875B3C" stroke-width="3"/><rect x="858" y="188" width="680" height="525" rx="14" fill="white" stroke="#e5e6d9" stroke-width="3"/>
<text x="893" y="238" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="32" font-weight="700">Evidence checklist</text>
<text x="893" y="277" fill="#875B3C" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="400">A modern jacket may share shape without issue history</text>
<rect x="942" y="340" width="505" height="295" rx="20" fill="#fff" stroke="#c7d2bb" stroke-width="3"/>
<text x="979" y="390" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="700">1  Inspect actual garment tag</text>
<text x="979" y="455" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="700">2  Record maker and date clues</text>
<text x="979" y="520" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="700">3  Check construction and size</text>
<text x="979" y="585" fill="#354A35" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="700">4  Do not infer government issue</text>
<rect x="62" y="765" width="1476" height="87" rx="16" fill="#354A35" stroke="#354A35" stroke-width="3"/><text x="92" y="817" fill="#ffffff" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="700">ALPHA BRAND HISTORY ≠ AUTHENTICATION OF THIS ITEM.</text>
</svg>