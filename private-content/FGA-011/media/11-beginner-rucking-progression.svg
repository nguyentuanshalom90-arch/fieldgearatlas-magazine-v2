<rect width="1600" height="900" fill="#FBF8F2"/><rect width="1600" height="14" fill="#354A35"/><text x="65" y="74" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#875B3C" text-anchor="start">FIELDGEARATLAS  /  ORIGINAL FIELD GUIDE</text><text x="65" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#354A35" text-anchor="start">Beginner Rucking: Four Decision Stages</text><text x="66" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#233528" text-anchor="start">Progress is repeatability, not a universal pack-weight number</text><rect x="55" y="300" width="360" height="340" rx="22" fill="#FFFFFF" stroke="#E5DCCB" stroke-width="2"/><circle cx="235" cy="380" r="49" fill="#354A35"/><text x="235" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text><text x="235" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#354A35" text-anchor="middle">WALK FIRST</text><text x="235" y="518" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#233528" text-anchor="middle">Known comfortable route</text><path d="M421 473 L435 473 M430 467 L437 473 L430 479" fill="none" stroke="#875B3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="442" y="300" width="360" height="340" rx="22" fill="#FFFFFF" stroke="#E5DCCB" stroke-width="2"/><circle cx="622" cy="380" r="49" fill="#354A35"/><text x="622" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text><text x="622" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#354A35" text-anchor="middle">FIT THE PACK</text><text x="622" y="518" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#233528" text-anchor="middle">Essentials only; stable fit</text><path d="M808 473 L822 473 M817 467 L824 473 L817 479" fill="none" stroke="#875B3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="829" y="300" width="360" height="340" rx="22" fill="#FFFFFF" stroke="#E5DCCB" stroke-width="2"/><circle cx="1009" cy="380" r="49" fill="#875B3C"/><text x="1009" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text><text x="1009" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#354A35" text-anchor="middle">ADD CAUTIOUSLY</text><text x="1009" y="518" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#233528" text-anchor="middle">Keep the same easy route</text><path d="M1195 473 L1209 473 M1204 467 L1211 473 L1204 479" fill="none" stroke="#875B3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1216" y="300" width="360" height="340" rx="22" fill="#FFFFFF" stroke="#E5DCCB" stroke-width="2"/><circle cx="1396" cy="380" r="49" fill="#875B3C"/><text x="1396" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><text x="1396" y="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#354A35" text-anchor="middle">REPEAT &amp; LOG</text><text x="1396" y="518" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#233528" text-anchor="middle">Change one variable at a time</text><text x="800" y="713" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#875B3C" text-anchor="middle">Stop or scale back for pain, numbness or unusually poor recovery.</text><rect x="52" y="812" width="1496" height="62" rx="12" fill="#354A35" stroke="none" stroke-width="0"/><text x="78" y="852" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font